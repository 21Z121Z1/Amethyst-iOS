name: Agent harness

on:
  push:
    branches-ignore: [l10n_main]
    paths:
      - 'tools/amethystd/**'
      - 'tools/amethystctl.py'
      - 'tests/agent/**'
      - 'agent-protocol/**'
      - 'lab/**'
      - 'Natives/**'
      - 'AGENTS.md'
      - 'WORKFLOW.md'
      - 'docs/agent/**'
      - 'requirements-agent.txt'
      - '.github/workflows/agent-harness.yml'
  pull_request:
    paths:
      - 'tools/amethystd/**'
      - 'tools/amethystctl.py'
      - 'tests/agent/**'
      - 'agent-protocol/**'
      - 'lab/**'
      - 'Natives/**'
      - 'AGENTS.md'
      - 'WORKFLOW.md'
      - 'docs/agent/**'
      - 'requirements-agent.txt'
      - '.github/workflows/agent-harness.yml'
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install host harness dependencies
        run: python3 -m pip install -r requirements-agent.txt
      - name: Compile host harness
        run: python3 -m compileall -q tools/amethystd tools/amethystctl.py
      - name: Run host harness tests
        run: python3 -m unittest discover -s tests/agent -v
      - name: Verify protocol JSON
        run: |
          python3 -m json.tool agent-protocol/v2.schema.json >/dev/null
          python3 -m json.tool agent-protocol/lab-event-v1.schema.json >/dev/null
      - name: Verify Codex-facing CLI and host preflight
        run: |
          python3 tools/amethystctl.py --help >/dev/null
          python3 tools/amethystctl.py runtime verify --help >/dev/null
          python3 tools/amethystctl.py logs query --help >/dev/null
          python3 tools/amethystctl.py input key --help >/dev/null
          python3 tools/amethystctl.py frame probe --help >/dev/null
          python3 tools/amethystctl.py doctor --host-only
      - name: Compile test-only Java lab event writer
        run: |
          rm -rf /tmp/amethyst-lab-classes
          mkdir -p /tmp/amethyst-lab-classes
          javac -d /tmp/amethyst-lab-classes lab/minecraft-probe/src/main/java/org/angelauramc/amethyst/lab/LabEvents.java

  native-build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
      - name: Install native build prerequisites
        run: brew install ldid wget
      - name: Build native target
        run: make native PLATFORM=2 BOOTJDK="$JAVA_HOME/bin" MAKEFLAGS=-j2
      - name: Verify native executable shape
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.amethystd.debug_package import require_macho_executable
          path = Path('Natives/build/AngelAuraAmethyst.app/AngelAuraAmethyst')
          require_macho_executable(path)
          print(path)
          PY
